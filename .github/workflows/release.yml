name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image for every host. The bundle of the app uses the same tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$(node -p "require('./packages/server/package.json').version")" ]; then
            echo "The tag is $version and packages/server/package.json has another version. Bump the version before the tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The container image runs Alpine with musl, so the bundle must use the same platform.
      # The job installs the production packages only, and then packs the code with them.
      - name: Pack the bundle
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:26.9.0-alpine3.24 sh -c '
            set -e
            npm ci
            npm run build
            npm ci --omit=dev --workspace @ladarr/server
            tar -czf ladarr-'"${{ steps.version.outputs.version }}"'.tar.gz package.json .npmrc packages node_modules
          '
          sha256sum "ladarr-${{ steps.version.outputs.version }}.tar.gz" > "ladarr-${{ steps.version.outputs.version }}.tar.gz.sha256"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ladarr-${{ steps.version.outputs.version }}.tar.gz" \
            "ladarr-${{ steps.version.outputs.version }}.tar.gz.sha256" \
            --title "v$GITHUB_REF_NAME" \
            --generate-notes
