name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the version of the release. The package and its lock follow it.
      - name: Set the version from the tag
        id: version
        run: |
          npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image for every host. The bundle of the app uses the same tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the version from the tag
        id: version
        run: |
          npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # The container image runs Alpine with musl, so the bundle must use the same platform.
      # The job installs the production packages only, and then packs the code with them.
      - name: Pack the bundle
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:26.9.0-alpine3.24 sh -c '
            set -e
            npm ci
            npm run build
            npm ci --omit=dev --workspace @ladarr/server
            tar -czf ladarr-'"${{ steps.version.outputs.version }}"'.tar.gz package.json .npmrc packages node_modules
          '
          sha256sum "ladarr-${{ steps.version.outputs.version }}.tar.gz" > "ladarr-${{ steps.version.outputs.version }}.tar.gz.sha256"

      # A second run of the same tag adds the files to the release that is already there.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "ladarr-${{ steps.version.outputs.version }}.tar.gz" \
              "ladarr-${{ steps.version.outputs.version }}.tar.gz.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "ladarr-${{ steps.version.outputs.version }}.tar.gz" \
              "ladarr-${{ steps.version.outputs.version }}.tar.gz.sha256" \
              --title "v$GITHUB_REF_NAME" \
              --generate-notes
          fi
