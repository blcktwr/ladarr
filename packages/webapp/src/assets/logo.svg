<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <style>
    .logo {
      overflow: visible;
    }

    .logo .magnet,
    .logo .spin {
      transform-origin: 16px 16px;
      transform-box: view-box;
    }

    .logo .magnet {
      animation: logo-magnet 10s infinite;
    }

    .logo .spin {
      animation: logo-spin 10s infinite;
    }

    .logo .field {
      animation: logo-field 10s infinite;
    }

    .logo .field .a,
    .logo .field .b {
      animation: logo-zap 0.24s steps(1) infinite;
    }

    .logo .field .b {
      animation-delay: -0.12s;
    }

    @keyframes logo-magnet {
      0% {
        transform: none;
        animation-timing-function: cubic-bezier(0.7, 0, 1, 0.6);
      }
      5.2% {
        transform: translateY(-3.26px) scale(0.96, 1.06);
        animation-timing-function: ease-out;
      }
      6.2% {
        transform: translateY(-4.25px) scale(1.05, 0.95);
        animation-timing-function: ease-in-out;
      }
      8% {
        transform: translateY(-3.8px);
        animation-timing-function: ease-in-out;
      }
      10% {
        transform: translateY(-3.08px) scale(0.96, 1.08);
        animation-timing-function: cubic-bezier(0.4, 0, 0.7, 0.4);
      }
      12.4% {
        transform: translateY(-1.28px) scale(0.88, 1.28);
        animation-timing-function: ease-in;
      }
      14% {
        transform: translateY(-0.74px) scale(0.85, 1.34);
        animation-timing-function: cubic-bezier(0.3, 0.9, 0.4, 1);
      }
      15.4% {
        transform: translateY(3.2px) scale(1.1, 0.88);
        animation-timing-function: ease-in-out;
      }
      17.2% {
        transform: translateY(-1px) scale(0.98, 1.04);
        animation-timing-function: ease-in-out;
      }
      18.6% {
        transform: translateY(0.4px) scale(1.01, 0.99);
        animation-timing-function: ease-in-out;
      }
      20%,
      100% {
        transform: none;
      }
    }

    @keyframes logo-spin {
      0%,
      12.4% {
        transform: rotate(0deg);
        animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.4);
      }
      14% {
        transform: rotate(14deg);
        animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      18.4%,
      100% {
        transform: rotate(-360deg);
      }
    }

    @keyframes logo-field {
      0% {
        opacity: 0;
      }
      1.6%,
      13.6% {
        opacity: 1;
      }
      14.4%,
      100% {
        opacity: 0;
      }
    }

    @keyframes logo-zap {
      0% {
        opacity: 1;
      }
      50%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo .magnet,
      .logo .spin,
      .logo .field,
      .logo .field .a,
      .logo .field .b {
        animation: none;
      }
    }
  </style>
  <circle cx="16" cy="16" r="16" fill="#111" />
  <g class="magnet">
    <g class="spin">
      <path d="M10 7 V16.5 A6 6 0 0 0 22 16.5 V7" fill="none" stroke="#fff" stroke-width="5" />
      <path d="M10 7 V11.5 M22 7 V11.5" fill="none" stroke="#00FF41" stroke-width="5" />
      <g class="field" opacity="0" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
        <g class="a">
          <path d="M0 0 L0.45 -0.8 L-0.45 -1.6 L0.45 -2.5 L-0.4 -3.4 L0.3 -4.2" transform="translate(10 6.4)" />
          <path d="M0 0 L0.45 -0.8 L-0.45 -1.6 L0.45 -2.5 L-0.4 -3.4 L0.3 -4.2" transform="translate(8.4 6.6) rotate(-45)" />
          <path d="M0 0 L0.45 -0.8 L-0.45 -1.6 L0.45 -2.5 L-0.4 -3.4 L0.3 -4.2" transform="translate(11.6 6.6) rotate(55)" />
          <path d="M0 0 L0.45 -0.8 L-0.45 -1.6 L0.45 -2.5 L-0.4 -3.4 L0.3 -4.2" transform="translate(22 6.4)" />
          <path d="M0 0 L0.45 -0.8 L-0.45 -1.6 L0.45 -2.5 L-0.4 -3.4 L0.3 -4.2" transform="translate(23.6 6.6) rotate(45)" />
          <path d="M0 0 L0.45 -0.8 L-0.45 -1.6 L0.45 -2.5 L-0.4 -3.4 L0.3 -4.2" transform="translate(20.4 6.6) rotate(-55)" />
        </g>
        <g class="b">
          <path d="M0 0 L-0.45 -0.8 L0.45 -1.6 L-0.45 -2.5 L0.4 -3.4 L-0.3 -4.2" transform="translate(10 6.4)" />
          <path d="M0 0 L-0.45 -0.8 L0.45 -1.6 L-0.45 -2.5 L0.4 -3.4 L-0.3 -4.2" transform="translate(8.4 6.6) rotate(-45)" />
          <path d="M0 0 L-0.45 -0.8 L0.45 -1.6 L-0.45 -2.5 L0.4 -3.4 L-0.3 -4.2" transform="translate(11.6 6.6) rotate(55)" />
          <path d="M0 0 L-0.45 -0.8 L0.45 -1.6 L-0.45 -2.5 L0.4 -3.4 L-0.3 -4.2" transform="translate(22 6.4)" />
          <path d="M0 0 L-0.45 -0.8 L0.45 -1.6 L-0.45 -2.5 L0.4 -3.4 L-0.3 -4.2" transform="translate(23.6 6.6) rotate(45)" />
          <path d="M0 0 L-0.45 -0.8 L0.45 -1.6 L-0.45 -2.5 L0.4 -3.4 L-0.3 -4.2" transform="translate(20.4 6.6) rotate(-55)" />
        </g>
      </g>
    </g>
  </g>
</svg>
